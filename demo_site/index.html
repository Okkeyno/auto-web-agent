
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Site</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #1d4ed8;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #success-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #dcfce7;
            color: #166534;
            border-radius: 7px;
        }

        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <span class="badge">Autonomous Web Agent Test Environment</span>

        <h1>Contact Form</h1>

        <p>
            This website is created to test the browser automation capabilities of our AI agent.
        </p>

        <form id="contact-form">

            <label for="name">Name Surname</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="subject">Subject</label>

            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Enter the subject"
                required
            >

            <label for="message">Message</label>

            <textarea
                id="message"
                name="message"
                placeholder="Enter your message"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

        <div id="success-message" role="status" aria-live="polite">
            Your message has been sent successfully!
        </div>

    </div>

    <script>

        const form = document.getElementById("contact-form");

        const successMessage =
            document.getElementById("success-message");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            successMessage.style.display = "block";

            successMessage.textContent =
                "Your message has been sent successfully!";

            form.reset();

        });

    </script>

</body>

</html>
